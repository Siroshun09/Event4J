name: Deploy Javadoc to Cloudflare
on:
  workflow_dispatch:

jobs:
  deploy-javadoc:
    uses: Siroshun09/javadoc-page-template/.github/workflows/deploy-javadoc.yml@09133f1985d2d16f6365b57734648ad53fbb5ff4 # main
    with:
      project_name: Event4J
      project_description: A simple event library for Java.
      custom_domain: javadoc.siroshun.dev
      javadocs_branch: javadoc
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
